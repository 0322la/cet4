<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="本地离线的英语四级备考教练：动态任务、SRS 词汇、错题本、打卡与复盘。">
<title>四级冲刺教练</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="四级冲刺">
<meta name="theme-color" content="#0a0d14">
<style>
:root{
  --bg:#080b13; --bg2:#0e1421; --panel:#111726; --panel2:#182031; --ink:#eaeff8; --muted:#8b99b3;
  --line:#232d42; --line2:#2e3a54;
  --brand:#4f6bff; --brand2:#8b9bff; --brand-soft:rgba(79,107,255,.14);
  --ok:#00d09c; --warn:#ffb020; --danger:#ff5c5c; --glow:rgba(79,107,255,.38);
  --radius:18px; --radius-sm:11px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 44px -22px rgba(0,0,0,.8);
  --shadow-sm:0 10px 22px -14px rgba(0,0,0,.85);
  --glass:rgba(20,27,44,.58); --glass2:rgba(30,40,60,.5); --glass3:rgba(12,17,29,.75);
  --glass-line:rgba(255,255,255,.09); --glass-line2:rgba(255,255,255,.14);
  --blur:18px;
  --font:"Inter","Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --tap:38px;
}
/* 主题色（设置里可切换） */
html[data-accent="violet"]{--brand:#8b5cf6;--brand2:#c4a8ff;--brand-soft:rgba(139,92,246,.15);--glow:rgba(139,92,246,.38)}
html[data-accent="teal"]{--brand:#0ea5a5;--brand2:#5eead4;--brand-soft:rgba(14,165,165,.15);--glow:rgba(14,165,165,.36)}
html[data-accent="amber"]{--brand:#f59e0b;--brand2:#fcd34d;--brand-soft:rgba(245,158,11,.15);--glow:rgba(245,158,11,.34)}
html[data-theme="light"]{
  --bg:#eef2f9; --bg2:#e4ebf7; --panel:#ffffff; --panel2:#f4f7fc; --ink:#111827; --muted:#5b6779;
  --line:#e3e9f3; --line2:#d3dcec;
  --brand:#2f4ee8; --brand2:#6580ff; --brand-soft:rgba(47,78,232,.10); --glow:rgba(47,78,232,.22);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 36px -22px rgba(18,32,64,.5);
  --shadow-sm:0 10px 22px -16px rgba(18,32,64,.55);
  --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.55); --glass3:rgba(255,255,255,.85);
  --glass-line:rgba(23,43,90,.07); --glass-line2:rgba(23,43,90,.12);
}
html[data-theme="light"][data-accent="violet"]{--brand:#7c3aed;--brand2:#a855f7;--brand-soft:rgba(124,58,237,.10);--glow:rgba(124,58,237,.24)}
html[data-theme="light"][data-accent="teal"]{--brand:#0d9488;--brand2:#14b8a6;--brand-soft:rgba(13,148,136,.10);--glow:rgba(13,148,136,.22)}
html[data-theme="light"][data-accent="amber"]{--brand:#d97706;--brand2:#f59e0b;--brand-soft:rgba(217,119,6,.10);--glow:rgba(217,119,6,.22)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 640px at 4% -16%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 62%),
    radial-gradient(820px 520px at 106% -8%, color-mix(in srgb, var(--ok) 14%, transparent), transparent 58%),
    radial-gradient(760px 520px at 88% 18%, color-mix(in srgb, var(--brand2) 12%, transparent), transparent 60%),
    radial-gradient(900px 600px at -10% 42%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 58%, var(--bg) 100%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
a{color:var(--brand)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand);color:#fff}
.wrap{max-width:1020px;margin:0 auto;padding:0 20px calc(128px + env(safe-area-inset-bottom))}

/* ---------- 顶栏（玻璃） ---------- */
.topbar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--glass3) 94%,transparent);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--glass-line)}
.topbar .inner{max-width:1020px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .dot{width:24px;height:24px;border-radius:8px;flex:none;
  background:linear-gradient(145deg,var(--brand),var(--brand2));
  box-shadow:0 0 0 4px var(--brand-soft),0 8px 18px -8px var(--glow)}
.brand small{display:block;font-weight:450;color:var(--muted);font-size:11.5px;letter-spacing:.4px}
.topstats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.stat-chip{background:var(--glass2);border:1px solid var(--glass-line);border-radius:999px;padding:4px 12px;
  font-size:12.5px;color:var(--muted);white-space:nowrap;backdrop-filter:blur(10px)}
.stat-chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.icon-btn{background:var(--glass2);border:1px solid var(--glass-line);border-radius:999px;width:36px;height:36px;
  display:grid;place-items:center;font-size:16px;backdrop-filter:blur(10px);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--brand);box-shadow:0 8px 18px -10px var(--glow)}
/* 顶栏底部的今日进度细线 */
.dayline{height:3px;background:color-mix(in srgb,var(--ink) 7%,transparent);overflow:hidden}
.dayline i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,var(--brand),var(--ok));
  box-shadow:0 0 14px var(--glow);transition:width .5s cubic-bezier(.2,.7,.3,1)}

/* ---------- 标签页（胶囊 + 图标） ---------- */
.tabs{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:35;
  background:color-mix(in srgb,var(--glass3) 88%,transparent);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--glass-line)}
.tabs .inner{max-width:1020px;margin:0 auto;padding:7px 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs .inner::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;
  border-radius:999px;padding:6px 14px;color:var(--muted);font-size:13.5px;white-space:nowrap;
  transition:color .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}
.tab svg{width:15px;height:15px;flex:none;opacity:.85}
.tab:hover{color:var(--ink);background:var(--glass2)}
.tab[aria-current="true"]{color:#fff;background:linear-gradient(145deg,var(--brand),var(--brand2));
  box-shadow:0 10px 22px -12px var(--glow)}
.tab[aria-current="true"] svg{opacity:1}
.tab .badge{background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px}

/* ---------- 通用卡片（玻璃 + 紧凑） ---------- */
section.view{display:none;padding-top:16px}
section.view[data-active="true"]{display:block}
.card{position:relative;background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,transparent,var(--glass-line2),transparent)}
.card+.card{margin-top:12px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card h2{margin:0 0 4px;font-size:16.5px;letter-spacing:.2px;font-weight:650}
.card h2 .sub{font-weight:450;color:var(--muted);font-size:12.5px;margin-left:8px}
.card .hint{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.tiny{font-size:12px}
.mt{margin-top:12px}
.sep{height:1px;background:linear-gradient(90deg,transparent,var(--glass-line2),transparent);margin:13px 0}

/* ---------- 按钮 / 输入（玻璃 + 紧凑） ---------- */
.btn{background:var(--glass2);border:1px solid var(--glass-line);border-radius:var(--radius-sm);padding:7px 13px;
  min-height:36px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  backdrop-filter:blur(10px);
  transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
.btn:hover{transform:translateY(-1px);border-color:var(--brand);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(145deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;
  box-shadow:0 12px 26px -14px var(--glow)}
.btn.primary:hover{box-shadow:0 16px 30px -14px var(--glow)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--glass2);border-color:var(--glass-line)}
.btn.ok{background:transparent;border-color:var(--ok);color:var(--ok)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
input[type=text],input[type=date],input[type=number],input[type=password],textarea,select{
  background:var(--glass2);border:1px solid var(--glass-line);border-radius:var(--radius-sm);padding:9px 12px;width:100%;
  backdrop-filter:blur(10px);transition:border-color .16s ease,box-shadow .16s ease}
textarea{min-height:80px;resize:vertical;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.field{display:block;margin-top:11px}
label.field span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}

/* ---------- 今日任务 ---------- */
.today-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{flex:none;position:relative;width:98px;height:98px}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 8px 18px var(--glow))}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:700;
  letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ring .pct small{display:block;font-size:10.5px;color:var(--muted);font-weight:450;text-align:center}
.task{display:flex;gap:11px;align-items:flex-start;background:var(--glass2);border:1px solid var(--glass-line);
  border-left:3px solid var(--brand);border-radius:14px;padding:11px 13px;backdrop-filter:blur(12px);
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
  animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
.task:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.task+.task{margin-top:8px}
.task[data-done="true"]{opacity:.62;border-left-color:var(--ok)}
.task[data-done="true"] .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
.task .box{width:23px;height:23px;border-radius:8px;border:1.5px solid var(--glass-line2);background:var(--glass);
  flex:none;margin-top:1px;display:grid;place-items:center;font-size:13px;
  transition:background .18s ease,border-color .18s ease,transform .18s ease}
.task .box:hover{border-color:var(--brand);transform:scale(1.08)}
.task[data-done="true"] .box{background:var(--ok);border-color:var(--ok);color:#04120d}
.task .body{flex:1;min-width:0}
.t-title{font-size:14.5px;font-weight:550;line-height:1.55}
.t-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--ink);
  border:1px solid transparent;white-space:nowrap;font-weight:500}
.chip.t-词汇{background:rgba(61,90,254,.16);color:#a8b6ff}
.chip.t-听力{background:rgba(0,200,150,.14);color:#62e6c0}
.chip.t-阅读{background:rgba(255,176,32,.14);color:#ffcd6b}
.chip.t-写作{background:rgba(255,82,82,.14);color:#ff9c9c}
.chip.t-翻译{background:rgba(160,110,255,.16);color:#c3a6ff}
.chip.t-精读{background:rgba(120,190,255,.16);color:#9fd0ff}
.chip.t-真题{background:rgba(255,255,255,.10);color:var(--muted)}
html[data-theme="light"] .chip.t-词汇,html[data-theme="light"] .chip.t-听力,html[data-theme="light"] .chip.t-阅读,
html[data-theme="light"] .chip.t-写作,html[data-theme="light"] .chip.t-翻译{color:var(--ink)}
.howto{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;color:var(--muted);font-size:12.5px;display:none}
.howto[data-open="true"]{display:block}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:3px 0}

/* ---------- 词汇 ---------- */
.flash{position:relative;overflow:hidden;text-align:center;padding:24px 22px;
  background:var(--glass2);border:1px solid var(--glass-line);border-radius:var(--radius);
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  animation:rise .3s ease both}
.flash::after{content:"";position:absolute;left:-10%;right:-10%;top:-45%;height:70%;pointer-events:none;
  background:radial-gradient(closest-side,var(--brand-soft),transparent)}
.flash .w{position:relative;font-family:var(--mono);font-size:34px;font-weight:650;letter-spacing:.5px;word-break:break-word}
.flash .pos{color:var(--muted);font-size:13px;margin-top:4px}
.flash .m{font-size:20px;margin-top:14px;min-height:32px}
.flash .ex{margin-top:12px;color:var(--muted);font-size:13.5px}
.flash .ex .en{font-style:italic}
.flash .acts{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.progressline{height:6px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin-top:12px}
.progressline i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--ok));
  box-shadow:0 0 12px var(--glow);transition:width .35s cubic-bezier(.2,.7,.3,1)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--glass-line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}

/* ---------- 复盘 ---------- */
.heat{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px;margin-top:12px;max-width:380px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--ok) 35%,var(--panel2));border-color:transparent}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--ok) 65%,var(--panel2));border-color:transparent}
.heat i[data-l="3"]{background:var(--ok);border-color:transparent}
.heat i[data-future]{opacity:.25}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.barchart{display:flex;gap:6px;align-items:flex-end;height:170px;margin-top:14px}
.bar-item{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;min-width:0}
.bar{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--brand);min-height:3px;
  transition:filter .18s ease}
.bar:hover{filter:brightness(1.2)}
.bar[data-off="true"]{background:var(--line)}
.bar-item span{font-size:10px;color:var(--muted);white-space:nowrap}
.milestone{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel2)}
.milestone[data-on="true"]{border-color:var(--ok)}
.milestone .num{font-size:18px;font-weight:650;min-width:52px;font-variant-numeric:tabular-nums}

/* ---------- 番茄钟 ---------- */
.pomo{position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(16px + env(safe-area-inset-bottom));
  background:var(--glass3);border:1px solid var(--glass-line);box-shadow:var(--shadow);border-radius:999px;
  padding:8px 14px;display:none;align-items:center;gap:12px;
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.pomo[data-on="true"]{display:flex}
.pomo .time{font-family:var(--mono);font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}

/* ---------- 弹层 ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--glass3);border:1px solid var(--glass-line);box-shadow:var(--shadow);border-radius:999px;
  padding:9px 16px;font-size:13.5px;backdrop-filter:blur(16px);animation:rise .24s ease both}
.toast.ok{border-color:var(--ok)}
.toast.warn{border-color:var(--warn)}
#modal{position:fixed;inset:0;z-index:90;background:rgba(4,7,14,.62);display:none;padding:24px;overflow:auto}
#modal[data-on="true"]{display:grid;place-items:center}
.sheet{background:var(--glass3);border:1px solid var(--glass-line);border-radius:var(--radius);max-width:620px;width:100%;
  padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);animation:rise .26s ease both;margin:auto}
footer{max-width:1020px;margin:26px auto 0;padding:0 20px;color:var(--muted);font-size:12px;text-align:center}
/* ---------- 悬浮打卡按钮（手机） ---------- */
.fab{position:fixed;right:16px;z-index:58;display:none;align-items:center;gap:8px;
  bottom:calc(16px + env(safe-area-inset-bottom));
  padding:12px 18px;border-radius:999px;border:1px solid transparent;color:#fff;font-size:14px;font-weight:600;
  background:linear-gradient(145deg,var(--brand),var(--brand2));
  box-shadow:0 16px 34px -14px var(--glow);
  transition:transform .18s ease,box-shadow .18s ease,bottom .28s ease,opacity .28s ease}
.fab:hover{transform:translateY(-2px)}
.fab[data-hidden="true"]{opacity:0;pointer-events:none;transform:translateY(12px)}
.fab[data-done="true"]{background:var(--glass3);color:var(--ok);border-color:var(--ok)}
body[data-pomo="true"] .fab{bottom:calc(78px + env(safe-area-inset-bottom))}

/* ---------- 打卡庆祝动效 ---------- */
.celebrate{position:fixed;inset:0;z-index:95;pointer-events:none;display:grid;place-items:center}
.celebrate .ringc{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid var(--ok);
  animation:burst .9s cubic-bezier(.2,.7,.3,1) forwards}
.celebrate .ringc.d2{border-color:var(--brand);animation-delay:.12s}
.celebrate .ringc.d3{border-color:var(--brand2);animation-delay:.24s}
@keyframes burst{from{transform:scale(.35);opacity:.9}to{transform:scale(2.7);opacity:0}}
.celebrate .msg{font-weight:700;font-size:17px;color:var(--ink);text-align:center;
  animation:pop .5s cubic-bezier(.2,.7,.3,1) both}
.celebrate .msg small{display:block;font-weight:450;font-size:12.5px;color:var(--muted);margin-top:4px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- 词汇小环形进度 ---------- */
.miniring{position:relative;width:58px;height:58px;flex:none}
.miniring svg{transform:rotate(-90deg)}
.miniring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;
  font-variant-numeric:tabular-nums;font-weight:650}

/* ---------- 主题色选择 ---------- */
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:var(--shadow-sm);
  transition:transform .16s ease,border-color .16s ease}
.swatch:hover{transform:scale(1.08)}
.swatch[data-on="true"]{border-color:var(--ink)}

/* ---------- 启动封面 ---------- */
#splash{position:fixed;inset:0;z-index:120;display:grid;place-items:end center;
  padding:0 26px 14vh;background:var(--bg);
  transition:opacity .45s ease,visibility .45s ease}
#splash[data-off="true"]{opacity:0;visibility:hidden;pointer-events:none}
#splash .cover{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;
  background-size:contain;filter:brightness(.86) saturate(1.04);animation:coverzoom 2s ease-out both}
#splash::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 78% at 50% 48%, transparent 34%, rgba(8,11,19,.62) 100%),
  linear-gradient(180deg,rgba(8,11,19,.88) 0%,rgba(8,11,19,.14) 18%,rgba(8,11,19,.14) 64%,rgba(8,11,19,.72) 78%,rgba(8,11,19,.96) 92%)}
#splash .splashbox{position:relative;z-index:1;text-align:center;padding:18px 30px;border-radius:22px;
  background:rgba(8,11,19,.66);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 26px 64px -22px rgba(0,0,0,.95);animation:pop .7s ease both}
#splash .stitle{font-size:23px;font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.65)}
#splash .sline{margin-top:10px;color:rgba(255,255,255,.9);font-size:14px;letter-spacing:1.5px;
  text-shadow:0 4px 16px rgba(0,0,0,.6)}
#splash .sline b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:0}
@keyframes coverzoom{from{transform:scale(1.14)}to{transform:scale(1.02)}}

@media (max-width:640px){
  body{font-size:14.5px}
  .brand small{display:none}
  .wrap{padding:0 13px calc(150px + env(safe-area-inset-bottom))}
  .topbar .inner,.tabs .inner{padding-left:13px;padding-right:13px}
  .card{padding:14px}
  .flash{padding:20px 16px}
  .flash .w{font-size:27px}
  .heat{grid-template-columns:repeat(9,1fr)}
  .fab{display:inline-flex}
  .grid.two{grid-template-columns:1fr}
  /* 手机上一排 7 个标签会被挤出屏幕（还自动滚到右边，把「今日」「流程」藏起来），
     改成等分网格：图标在上、文字在下，7 个一起显示，谁也不会被推到屏幕外 */
  .tabs .inner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;overflow:visible;padding:6px 8px}
  .tab{flex-direction:column;gap:3px;justify-content:center;padding:6px 2px;font-size:11px;line-height:1.15;
    border-radius:12px;min-width:0;position:relative}
  .tab svg{width:17px;height:17px}
  .tab>span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tab .badge{position:absolute;top:3px;right:7px}
  /* 设置页的表单太高，一屏只能看到两三项，手机上压一压 */
  label.field{margin-top:9px}
  label.field span{margin-bottom:4px}
  input[type="number"],input[type="text"],input[type="search"],select{height:42px;padding:0 12px}
  textarea{min-height:72px;padding:9px 12px}
}
</style>
</head>

function freshState() {
  const t = todayKey();
  return {
    version: 1,
    settings: {
      examDate: '2026-12-12',
      startDate: t,
      dailyMinutes: 110,
      theme: 'dark',
      accent: 'blue',
      wordUnit: 1,
      wordUnitTotal: 11,
      newWordsPerDay: 35,
      zhentiNo: 1,
      aiBase: 'https://api.deepseek.com',
      aiModel: 'deepseek-chat',
      aiKey: ''
    },
    days: {},
    words: {},
    mistakes: [],
    reflections: [],
    routines: {},
    meta: { created: t, lastOpen: t, lastPrompt: '', milestones: [], scores: [] }
  };
}

let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return freshState();
    const parsed = JSON.parse(raw);
    const base = freshState();
    return { ...base, ...parsed, settings: { ...base.settings, ...(parsed.settings || {}) }, meta: { ...base.meta, ...(parsed.meta || {}) } };
  } catch (e) {
    toast('读取本地数据失败，已启用空白数据（原数据仍在浏览器里）', 'warn');
    return freshState();
  }
}

let saveTimer = null;
function save(now) {
  const run = () => {
    try {
      S.meta.lastOpen = todayKey();
      localStorage.setItem(KEY, JSON.stringify(S));
    } catch (e) {
      toast('保存失败：浏览器存储可能已满，请先导出备份', 'warn');
    }
  };
  if (now) return run();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(run, 250);
}

/* 每日备份一份，防止误删 */
function dailyBackup() {
  try {
    const key = 'cet4coach.backup.' + todayKey();
    if (!localStorage.getItem(key)) localStorage.setItem(key, JSON.stringify(S));
    const stale = Object.keys(localStorage).filter(k => k.startsWith('cet4coach.backup.')).sort();
    while (stale.length > 7) localStorage.removeItem(stale.shift());
  } catch (e) { /* 存储满时忽略 */ }
}

/* ---------------------------------------------------------------------
   2. 计划引擎：阶段 + 动态任务量
   --------------------------------------------------------------------- */
function dayInfo() {
  const left = dayDiff(todayKey(), S.settings.examDate);
  let phase;
  if (left > 45) phase = { id: 'foundation', name: '地基期', goal: '把高频词和听力语感补回来' };
  else if (left > 21) phase = { id: 'build', name: '强化期', goal: '真题拆开练，写作模板成型' };
  else phase = { id: 'sprint', name: '冲刺期', goal: '整套模拟 + 错题回炉' };
  return { left, phase };
}

function recentStats(n) {
  let total = 0, done = 0, minutes = 0, checkins = 0;
  const keys = [];
  for (let i = 0; i < n; i++) {
    const k = shiftKey(todayKey(), -i);
    keys.push(k);
    const d = S.days[k];
    if (!d) continue;
    if (d.checkin) checkins++;
    minutes += d.minutes || 0;
    (d.tasks || []).forEach(t => { total++; if (t.done) done++; });
  }
  const rate = total ? done / total : null;
  return { rate, total, done, minutes, checkins, keys };
}

function vocabAccuracy(n) {
  let right = 0, seen = 0;
  for (let i = 0; i < n; i++) {
    const d = S.days[shiftKey(todayKey(), -i)];
    if (!d || !d.review) continue;
    right += d.review.right || 0;
    seen += d.review.seen || 0;
  }
  return seen ? right / seen : null;
}

/* 只统计「今天之前」的完成率：今天还没开始，不能算作完成率低 */
function pastStats(n) {
  let total = 0, done = 0;
  for (let i = 1; i <= n; i++) {
    const d = S.days[shiftKey(todayKey(), -i)];
    if (!d) continue;
    (d.tasks || []).forEach(t => { total++; if (t.done) done++; });
  }
  return { total, done, rate: total ? done / total : null };
}

/* 根据前几天的完成率自动缩放任务量，避免越挫越放弃 */
function loadFactor() {
  const st = pastStats(7);
  if (st.rate === null || st.total < 5) return { factor: 1, note: '刚开始，按标准量来' };
  if (st.rate < 0.45) return { factor: 0.65, note: '最近完成率偏低，任务量已下调，先把节奏稳住' };
  if (st.rate < 0.7) return { factor: 0.8, note: '任务量小幅下调，稳一周再加回去' };
  if (st.rate > 0.94) return { factor: 1.15, note: '连着完成得很好，任务量已自动加码' };
  return { factor: 1, note: '任务量按标准安排' };
}

function buildTasks(dateKey) {
  const info = dayInfo();
  const { factor, note } = loadFactor();
  const acc = vocabAccuracy(3);
  const mins = S.settings.dailyMinutes;
  /* 词汇的时间占比：地基期最重。新词量、复习量都跟着「词汇分钟数」自动伸缩，
     所以你把每日时长调大，真正变多的不只是分钟，还有每天要记的词数。 */
  const vocabShare = info.phase.id === 'foundation' ? 0.46 : info.phase.id === 'build' ? 0.30 : 0.20;
  const vocabMins = mins * vocabShare;
  const accFactor = (acc !== null && acc < 0.7) ? 0.7 : 1;
  const manualNew = Number(S.settings.newWordsPerDay) || 0;
  const newWords = manualNew > 0
    ? clamp(Math.round(manualNew * accFactor), 5, 120)
    : clamp(Math.round(vocabMins * 0.70 * factor * accFactor), 8, 80);
  const reviewWords = clamp(Math.round(vocabMins * 1.60 * factor), 20, 300);
  const stillNew = Object.values(S.words).some(w => w.box === null);
  const tasks = [];
  const push = (type, title, minutes) => tasks.push({
    id: uid(), type, title, minutes,
    steps: TASK_STEPS[type] || [], done: false, doneAt: '', note: ''
  });

  const u = S.settings.wordUnit || 1;
  const z = S.settings.zhentiNo || 1;
  const BOOK = '《闪过四级词汇》';
  const PAPER = '《刘晓燕四级真题快刷》';
  if (info.phase.id === 'foundation') {
    push('词汇', stillNew
      ? `${BOOK}第 ${u} 单元（新词 ${newWords} 个）：看英文想中文，想不起来的点「忘记」，再复习 ${reviewWords} 个旧词`
      : `${BOOK}已过完一遍：今天是纯复习，把到期的 ${reviewWords} 个词过一遍，重点看标过「忘记」的`,
      Math.round(mins * 0.46));
    push('听力', `${PAPER}第 ${z} 套：挑一段 3–4 分钟的音频精听（不是整套）：盲听 → 逐句听写 → 抄下听不懂的词`, Math.round(mins * 0.21));
    push('精读', `${PAPER}第 ${z} 套里最看不懂的那一篇：不掐时间，逐句翻成中文`, Math.round(mins * 0.15));
    push('阅读', `${PAPER}第 ${z} 套仔细阅读 1 篇：先看题干、按顺序定位，限时 9 分钟`, Math.round(mins * 0.09));
    push('翻译', `${PAPER}第 ${z} 套翻译：1 句，改到自己满意`, Math.round(mins * 0.05));
    push('词汇', '把昨天点「忘记」的词单独过一遍', Math.max(5, Math.round(mins * 0.04)));
  } else if (info.phase.id === 'build') {
    push('词汇', `${BOOK}第 ${u} 单元（新词 ${newWords} 个）+ 复习队列 ${reviewWords} 个`, Math.round(mins * 0.26));
    push('听力', `${PAPER}第 ${z} 套听力完整做一遍（25 分钟不停）`, Math.round(mins * 0.28));
    push('阅读', `${PAPER}第 ${z} 套阅读 2 篇，限时 18 分钟`, Math.round(mins * 0.26));
    push('写作', `写 1 篇作文（120 词）或背 1 个万能句型`, Math.round(mins * 0.2));
  } else {
    const twoDay = dayDiff(S.settings.startDate, dateKey) % 2 === 0;
    if (twoDay) push('真题', `${PAPER}第 ${z} 套：严格按考试时间整套做完`, Math.round(mins * 0.75));
    else push('真题', `第 ${z} 套的错题回炉 + 写作重写一遍`, Math.round(mins * 0.5));
    push('词汇', `快刷 ${reviewWords} 个词（只求反应快，不求背）`, Math.round(mins * 0.2));
    push('听力', `第 ${z} 套里错得最多的那篇听力，重听 2 遍`, Math.round(mins * 0.15));
  }
  return { tasks, newWords, reviewWords, note, phase: info.phase };
}

function ensureToday(force) {
  const k = todayKey();
  if (!S.days[k]) S.days[k] = { tasks: [], checkin: false, minutes: 0, pomodoros: 0, note: '', generatedAt: k, review: { seen: 0, right: 0 }, stepDone: {} };
  const day = S.days[k];
  if (!day.review) day.review = { seen: 0, right: 0 };
  if (!day.tasks || day.tasks.length === 0 || force) {
    const built = buildTasks(k);
    const old = day.tasks || [];
    if (force && old.length) {
      /* 重新生成时：同名的已完成任务沿用原来的勾选状态，避免越点越重复；
         自己加的任务、以及已完成但新方案里没有的，都保留下来 */
      const doneByTitle = new Map();
      old.forEach(t => { if (t.done && !doneByTitle.has(t.title)) doneByTitle.set(t.title, t); });
      const merged = built.tasks.map(t => {
        const prev = doneByTitle.get(t.title);
        return prev ? { ...t, done: true, doneAt: prev.doneAt || '', spent: prev.spent || 0 } : t;
      });
      const kept = new Set(merged.map(t => t.title));
      const extras = old.filter(t => (t.custom || t.done) && !kept.has(t.title));
      day.tasks = [...merged, ...extras];
    } else {
      day.tasks = built.tasks;
    }
    day.newWords = built.newWords;
    day.reviewWords = built.reviewWords;
    day.note = built.note;
  }
  save();
  return day;
}

function streakCount() {
  let n = 0;
  let k = todayKey();
  if (!(S.days[k] && S.days[k].checkin)) k = shiftKey(k, -1);
  while (S.days[k] && S.days[k].checkin) { n++; k = shiftKey(k, -1); }
  return n;
}
const checkinDays = () => Object.keys(S.days).filter(k => S.days[k].checkin).length;

/* --- 番茄钟 --- */
const pomo = { on: false, total: 25 * 60, left: 25 * 60, running: false, timer: null, taskId: null, endAt: 0, wakeLock: null };

/* 计时用「真实的结束时刻」来算，而不是每秒减一。
   手机熄屏、切到别的 App、甚至系统把页面重载，都不会让计时失效。 */
function pomoRemaining() {
  if (!pomo.on) return 0;
  if (pomo.running && pomo.endAt) return Math.max(0, Math.round((pomo.endAt - Date.now()) / 1000));
  return Math.max(0, pomo.left);
}

function savePomo() {
  S.meta.pomo = pomo.on ? {
    total: pomo.total, left: pomo.left, running: pomo.running,
    endAt: pomo.endAt, taskId: pomo.taskId,
    label: $('#pomoLabel') ? $('#pomoLabel').textContent : ''
  } : null;
  save();
}

/* 专注时尽量不让屏幕自动熄灭；浏览器不支持就跳过，不影响计时 */
async function requestWakeLock() {
  try {
    if (pomo.wakeLock || !pomo.on || !pomo.running) return;
    if (!('wakeLock' in navigator)) return;
    pomo.wakeLock = await navigator.wakeLock.request('screen');
    pomo.wakeLock.addEventListener('release', () => { pomo.wakeLock = null; });
  } catch (e) { /* 忽略 */ }
}
function releaseWakeLock() {
  try { if (pomo.wakeLock) { pomo.wakeLock.release(); pomo.wakeLock = null; } } catch (e) { }
}

/* 把「这一段已经专注的时间」记进今天，返回记录了几分钟 */
function settleRunning(silent) {
  if (!pomo.on || !pomo.running) return 0;
  const used = Math.round((pomo.total - pomoRemaining()) / 60);
  if (used < 1) return 0;
  const day = ensureToday();
  day.minutes = (day.minutes || 0) + used;
  const task = (day.tasks || []).find(t => t.id === pomo.taskId);
  if (task) task.spent = (task.spent || 0) + used;
  save();
  if (!silent) toast(`上一段专注 ${used} 分钟已记入今天`, 'ok');
  return used;
}

function pomoStart(minutes, taskId, label) {
  settleRunning(false);                 /* 中途换任务，先把上一段结算掉，别丢时间 */
  clearInterval(pomo.timer);
  pomo.on = true;
  pomo.total = Math.max(1, Math.round(minutes)) * 60;
  pomo.left = pomo.total;
  pomo.running = true;
  pomo.endAt = Date.now() + pomo.left * 1000;
  pomo.taskId = taskId || null;
  $('#pomoLabel').textContent = label || '专注中';
  $('#pomo').dataset.on = 'true';
  document.body.dataset.pomo = 'true';
  pomo.timer = setInterval(pomoTick, 1000);
  renderPomo(); savePomo(); requestWakeLock();
}

function pomoTick() {
  if (!pomo.on) return;
  pomo.left = pomoRemaining();
  if (pomo.running && pomo.left <= 0) { pomoFinish(); return; }
  renderPomo();
}

function renderPomo() {
  if (!pomo.on) return;
  const left = pomoRemaining();
  pomo.left = left;
  $('#pomoTime').textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
  $('#pomoPause').textContent = pomo.running ? '暂停' : '继续';
}

function pomoFinish() {
  clearInterval(pomo.timer);
  const mins = Math.round(pomo.total / 60);
  const day = ensureToday();
  day.minutes = (day.minutes || 0) + mins;
  day.pomodoros = (day.pomodoros || 0) + 1;
  const task = (day.tasks || []).find(t => t.id === pomo.taskId);
  if (task) task.spent = (task.spent || 0) + mins;
  pomo.on = false; pomo.running = false; S.meta.pomo = null;
  save(true); beep();
  toast(`完成 ${mins} 分钟专注，已计入今日`, 'ok');
  $('#pomo').dataset.on = 'false';
  document.body.dataset.pomo = 'false';
  releaseWakeLock();
  render();
}

/* 从熄屏或别的 App 回来时，立刻按真实时间对一次表 */
function pomoSync() {
  if (!pomo.on) return;
  pomoTick();
  if (pomo.on && pomo.running) requestWakeLock();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pomoSync(); });
window.addEventListener('focus', pomoSync);
window.addEventListener('pageshow', pomoSync);

/* 页面被系统重载后（iOS 内存回收时会这样），把计时状态接回来 */
function restorePomo() {
  const p = S.meta && S.meta.pomo;
  if (!p) return;
  if (p.running && p.endAt) {
    pomo.on = true; pomo.running = true;
    pomo.total = p.total || 1500; pomo.endAt = p.endAt; pomo.taskId = p.taskId || null;
    $('#pomoLabel').textContent = p.label || '专注中';
    $('#pomo').dataset.on = 'true';
    document.body.dataset.pomo = 'true';
    const left = Math.round((p.endAt - Date.now()) / 1000);
    if (left > 0) {
      pomo.left = left;
      pomo.timer = setInterval(pomoTick, 1000);
      renderPomo(); requestWakeLock();
    } else {
      pomo.left = 0;
      pomoFinish();
      toast('刚才那段专注已经完成，时间已记入今天', 'ok');
    }
  } else if (p.left > 0) {
    pomo.on = true; pomo.running = false;
    pomo.total = p.total || 1500; pomo.left = p.left; pomo.taskId = p.taskId || null;
    $('#pomoLabel').textContent = p.label || '已暂停';
    $('#pomo').dataset.on = 'true';
    document.body.dataset.pomo = 'true';
    renderPomo();
  }
}
/* 用系统朗读把单词念出来：你现在的问题是「听得清但想不起意思」，这个按钮专门练它。
   iOS 上有三个坑，下面都绕开了：
   1) 静音开关会把系统朗读掐掉 —— 先播一段无声音频，把音频通道切到「播放」模式；
   2) 语音列表要等 voiceschanged 事件才拿得到，一开始取是空数组；
   3) cancel() 紧接着 speak() 会被吞掉，中间必须留一点时间。 */
const SILENT_WAV = 'data:audio/wav;base64,UklGRnQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
let enVoice = null, audioWarmed = false;

function loadVoices() {
  try {
    const vs = window.speechSynthesis.getVoices() || [];
    if (!vs.length) return;
    const en = vs.filter(v => /^en/i.test(v.lang));
    if (!en.length) return;
    const want = S.settings.voiceURI;   /* 你在设置里选过的那条 */
    enVoice = (want && (en.find(v => v.voiceURI === want) || en.find(v => v.name === want)))
      || en.find(v => /^en[-_]?US/i.test(v.lang))   /* 没选过：美音优先 */
      || en.find(v => /^en[-_]?GB/i.test(v.lang))
      || en[0];
  } catch (e) { /* 忽略 */ }
}
/* 给设置页用：把系统里的英语语音列出来 */
function englishVoiceList() {
  try { return (window.speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang)); }
  catch (e) { return []; }
}
function voiceLabel(v) {
  const us = /^en[-_]?US/i.test(v.lang), gb = /^en[-_]?GB/i.test(v.lang);
  return v.name + '（' + (us ? '美音' : gb ? '英音' : v.lang) + '）';
}
/* 设置页那个下拉框的选项 */
function voiceOptionsHtml() {
  const list = englishVoiceList();
  const cur = S.settings.voiceURI || '';
  let out = '<option value="">自动（美音优先）</option>';
  if (!list.length) out += '<option value="" disabled>（语音还没加载好，点右边「刷新语音列表」）</option>';
  else out += list.map(v => {
    const val = v.voiceURI || v.name;
    return `<option value="${esc(val)}" ${cur === val ? 'selected' : ''}>${esc(voiceLabel(v))}</option>`;
  }).join('');
  return out;
}
if ('speechSynthesis' in window) {
  loadVoices();
  try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { }
}

/* 第一次碰屏幕时放一段无声 wav：iOS 借此把音频通道切成「播放」，
   之后系统朗读不会被静音开关掐掉，「听音想义」的自动朗读也才念得出来 */
function warmAudio() {
  if (audioWarmed) return;
  audioWarmed = true;
  try {
    const a = new Audio(SILENT_WAV);
    a.volume = 0.01;
    const p = a.play();
    if (p && p.catch) p.catch(() => { });
  } catch (e) { /* 忽略 */ }
}
document.addEventListener('pointerdown', warmAudio, { once: true, passive: true });

function speak(text) {
  const txt = String(text || '').trim();
  if (!txt) return;
  if (!('speechSynthesis' in window)) return toast('这个浏览器不支持朗读', 'warn');
  warmAudio();
  loadVoices();
  const synth = window.speechSynthesis;
  try { synth.cancel(); } catch (e) { }
  /* 给 cancel 留 60ms，否则 iOS 上这一条会被吞掉、听不到声音 */
  setTimeout(() => {
    try {
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = enVoice ? enVoice.lang : 'en-US';
      u.rate = 0.9; u.pitch = 1; u.volume = 1;
      if (enVoice) u.voice = enVoice;
      try { synth.resume(); } catch (e) { }
      synth.speak(u);
    } catch (e) { /* 静默失败，不影响背单词 */ }
  }, 60);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.28, 0.56].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.22);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.24);
    });
  } catch (e) { /* 浏览器不允许自动播放时静默 */ }
}
$('#pomoPause').addEventListener('click', () => {
  if (!pomo.on) return;
  clearInterval(pomo.timer);
  if (pomo.running) {
    pomo.left = pomoRemaining();     /* 暂停：把剩余秒数定住 */
    pomo.running = false;
  } else {
    pomo.running = true;             /* 继续：从现在的时刻重新算结束点 */
    pomo.endAt = Date.now() + pomo.left * 1000;
    pomo.timer = setInterval(pomoTick, 1000);
    requestWakeLock();
  }
  renderPomo(); savePomo();
});
$('#pomoStop').addEventListener('click', () => {
  clearInterval(pomo.timer);
  const used = settleRunning(true);
  if (used >= 1) toast(`本次专注 ${used} 分钟，已记录`, 'ok');
  pomo.on = false; pomo.running = false; S.meta.pomo = null;
  $('#pomo').dataset.on = 'false';
  document.body.dataset.pomo = 'false';
  save(true);
  releaseWakeLock();
  render();
});

const SRS_DAYS = [1, 2, 4, 7, 15, 30];
const SRS_LABEL = ['第 1 天', '第 2 天', '第 4 天', '第 7 天', '第 15 天', '第 30 天'];

/* ---------------------------------------------------------------------
   5. 词汇模块
   --------------------------------------------------------------------- */
let vocabTab = 'review';
let vq = [], vIdx = 0, vRevealed = false, vRight = 0, vTotal = 0;
let vMode = 'read';      // read = 看词想义；listen = 听音想义
let vLastSpoken = -1;
let vqSample = new Set();  // 本轮里属于「抽查」的词
let undoStack = [];        // 最近几次「记得/忘记」之前的状态，误触了可以退回来

/* 换一轮：队列重建的时候，指针、统计、撤回栈都要跟着归零，
   否则切到别的页面再回来会从中间接着走（跳号）。 */
function startNewQueue() {
  vq = buildVocabQueue();
  vIdx = 0; vRevealed = false; vRight = 0; vTotal = 0; vLastSpoken = -1;
  undoStack = [];
}

function seedWords(force) {
  let added = 0, i = 0;
  SEED_WORDS.split('\n').forEach(line => {
    i++;
    const [w, pos, m] = line.split('|').map(s => (s || '').trim());
    if (!w || !m) return;
    /* ord 给大值：自己导入的词永远排在内置词表前面 */
    if (!S.words[w]) { S.words[w] = { w, pos: pos || '', m, box: null, due: '', lapses: 0, seen: 0, right: 0, ord: 100000 + i }; added++; }
  });
  save(true);
  return added;
}

/* 新词顺序：按你导入的先后排，也就是按书上单元的先后排 */
function nextWordOrd() {
  S.meta.wordSeq = (S.meta.wordSeq || 0) + 1;
  return S.meta.wordSeq;
}

/* 旧数据里没有 ord 的词补一个：内置词表排后面，自己导入的按录入顺序排前面 */
function migrateWordOrder() {
  if (S.meta.ordMigrated) return;
  const seedSet = new Set(SEED_WORDS.trim().split('\n').map(l => (l.split('|')[0] || '').trim()).filter(Boolean));
  let seq = S.meta.wordSeq || 0, changed = false;
  Object.values(S.words).forEach(w => {
    if (typeof w.ord === 'number') return;
    if (seedSet.has(w.w)) w.ord = 100000;
    else w.ord = ++seq;
    changed = true;
  });
  S.meta.wordSeq = seq;
  S.meta.ordMigrated = true;
  if (changed) save(true);
}

function addWord(w, pos, m) {
  const key = String(w || '').trim();
  if (!key) return false;
  const exist = S.words[key];
  if (exist) {
    /* 已存在这个词：更新释义和词性，但保留原来的记忆进度，并把它并入「书上顺序」 */
    if (pos) exist.pos = pos;
    if (m) exist.m = m;
    if (typeof exist.ord !== 'number' || exist.ord >= 100000) exist.ord = nextWordOrd();
    save(true);
    return false;
  }
  S.words[key] = { w: key, pos: pos || '', m: m || '（待补充释义）', box: null, due: '', lapses: 0, seen: 0, right: 0, ord: nextWordOrd() };
  save(true);
  return true;
}

/* 把内置词表里「还没学过、也不在你的书里」的词删掉，只留你自己导入的 */
function removeSeedWords() {
  const seeds = new Set(SEED_WORDS.trim().split('\n').map(l => (l.split('|')[0] || '').trim()).filter(Boolean));
  let removed = 0;
  Object.keys(S.words).forEach(k => {
    const w = S.words[k];
    const isSeedOnly = seeds.has(k) && !(typeof w.ord === 'number' && w.ord < 100000);
    if (isSeedOnly && w.box === null) { delete S.words[k]; removed++; }
  });
  save(true);
  return removed;
}

function wordStats() {
  const all = Object.values(S.words);
  return {
    total: all.length,
    fresh: all.filter(w => w.box === null).length,
    learning: all.filter(w => w.box !== null && w.box < 4).length,
    mastered: all.filter(w => w.box !== null && w.box >= 4).length,
    due: all.filter(w => w.box !== null && w.due && w.due <= todayKey()).length
  };
}

function buildVocabQueue() {
  const k = todayKey();
  const day = ensureToday();

  /* 同一天里只定一份清单：把已经点过的词剔掉，剩下的接着做。
     以前每次重新打开都会"再抓一批新词"，结果上午背一半、下午再开，
     总量反而变大（越背越多）。现在一天的清单固定，分几次做都是同一份。 */
  if (Array.isArray(day.vqKeys) && day.vqKeys.length) {
    const keep = day.vqKeys.map(x => S.words[x])
      .filter(w => w && (w.box === null || (w.due && w.due <= k)));
    vqSample = new Set(day.vqSample || []);
    return keep;
  }

  const all = Object.values(S.words);
  const due = all.filter(w => w.box !== null && w.due && w.due <= k)
    .sort((a, b) => (a.box - b.box) || a.due.localeCompare(b.due));
  const fresh = all.filter(w => w.box === null).sort((a, b) => (a.ord || 100000) - (b.ord || 100000));
  const rl = day.reviewWords || 80, nl = day.newWords || 20;
  const duePart = due.slice(0, rl);
  vqSample = new Set();
  let result, sampleKeys = [];

  /* 书上的词全过完之后，进入「滚动抽查」：随机把学过的词翻出来再见一面，
     不让「背完一遍」变成「慢慢忘光」。 */
  if (fresh.length === 0) {
    const dueKeys = new Set(duePart.map(w => w.w));
    const pool = all.filter(w => w.box !== null && w.box >= 1 && !dueKeys.has(w.w));
    /* 抽查用「日期+单词」定序，不用随机数：同一天里不管打开几次，
      抽到的都是同一批词、同一个顺序，进度条才不会自己跳。 */
    const seedHash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
    pool.sort((a, b) => seedHash(k + '|' + a.w) - seedHash(k + '|' + b.w));
    const sample = pool.slice(0, Math.min(Math.round(rl * 0.25), pool.length));
    sample.forEach(w => vqSample.add(w.w));
    result = [...duePart, ...sample];
    sampleKeys = sample.map(w => w.w);
  } else {
    result = [...duePart, ...fresh.slice(0, nl)];
  }

  day.vqKeys = result.map(w => w.w);
  day.vqSample = sampleKeys;
  if (!day.vocabTarget) day.vocabTarget = result.length;   /* 今天的目标量，定了就不改 */
  save();
  return result;
}

function gradeWord(ok) {
  const w = vq[vIdx];
  if (!w) return;
  const k = todayKey(), day = ensureToday();
  const word = S.words[w.w];
  /* 先把这个词「点之前」的样子整份记下来：误触了能原样退回去，
     连记忆强度的变化、今天的计数一起撤销。 */
  undoStack.push({
    key: w.w, ok: !!ok,
    had: !!word,
    box: word ? word.box : null, due: word ? (word.due || '') : '',
    lapses: word ? (word.lapses || 0) : 0,
    seen: word ? (word.seen || 0) : 0, right: word ? (word.right || 0) : 0,
    daySeen: (day.review && day.review.seen) || 0,
    dayRight: (day.review && day.review.right) || 0,
    vRight, vTotal, idx: vIdx
  });
  if (undoStack.length > 40) undoStack.shift();
  if (word) {
    if (ok) { word.box = Math.min(SRS_DAYS.length - 1, (word.box === null ? 0 : word.box + 1)); word.due = shiftKey(k, SRS_DAYS[word.box]); }
    else { word.lapses = (word.lapses || 0) + 1; word.box = 0; word.due = shiftKey(k, 1); }
    word.seen = (word.seen || 0) + 1;
    if (ok) word.right = (word.right || 0) + 1;
  }
  day.review.seen = (day.review.seen || 0) + 1;
  if (ok) day.review.right = (day.review.right || 0) + 1;
  if (ok) vRight++;
  vTotal++;
  save();
  vIdx++; vRevealed = false;
  renderVocab();
}

/* 退回上一个词：把这个词的记忆进度、今天的计数、按下的次数全部还原，
   然后停在那个词上、直接显示答案，你可以重新点一次「记得/忘记」。 */
function undoLast() {
  const s = undoStack.pop();
  if (!s) return toast('已经是第一个词了，没有可以退回的', 'warn');
  const day = ensureToday();
  const word = S.words[s.key];
  if (word) {
    word.box = s.box; word.due = s.due;
    word.lapses = s.lapses; word.seen = s.seen; word.right = s.right;
  }
  if (day.review) { day.review.seen = s.daySeen; day.review.right = s.dayRight; }
  vRight = s.vRight; vTotal = s.vTotal;
  vIdx = s.idx; vRevealed = true;
  save(true); renderVocab();
  toast(`已退回「${s.key}」，刚才那一次${s.ok ? '记得' : '忘记'}已撤销`, 'ok');
}

function renderVocab() {
  const el = $('#view-vocab');
  const st = wordStats();
  if (vq.length === 0) vq = buildVocabQueue();

  const tabsHtml = `
    <div class="row" style="gap:6px">
      ${[['review', '今日复习'], ['bank', '词库'], ['stat', '统计']].map(([id, label]) =>
        `<button class="btn sm ${vocabTab === id ? 'primary' : 'ghost'}" data-vtab="${id}">${label}</button>`).join('')}
      <span class="muted tiny" style="margin-left:auto">共 ${st.total} 词 · 待复习 ${st.due} · 新词 ${st.fresh}</span>
    </div>`;

  const modeHtml = vocabTab === 'review' ? `
    <div class="row" style="gap:6px;margin-top:8px">
      <span class="tiny muted">练法：</span>
      <button class="btn sm ${vMode === 'read' ? 'primary' : 'ghost'}" data-vmode="read">看词想义</button>
      <button class="btn sm ${vMode === 'listen' ? 'primary' : 'ghost'}" data-vmode="listen">🔊 听音想义</button>
      <span class="tiny muted">听音想义＝只放声音、不显示单词，先想意思再揭晓</span>
    </div>` : '';

  let bodyHtml = '';
  if (vocabTab === 'review') {
    /* 今天的词汇进度：按「今天已经点过的 + 这一轮还剩的」算。
       以前只算这一轮，所以你中午背一半、下午重新打开时进度条会归零。
       现在不管分几次做，分子分母都跟着今天的总量走。 */
    const today = ensureToday();
    const dayDone = (today.review && today.review.seen) || 0;
    const dayLeft = vq.length - vIdx;
    /* 今天的目标量在当天第一次打开时就定了（实际排进来的复习量 + 新词量），
       所以分几次做、重新打开几次，分母都是同一个数。 */
    const dayTarget = Math.max(1, Number(today.vocabTarget) || (dayDone + Math.max(0, dayLeft)));
    const dayPct = Math.min(100, Math.round(dayDone / dayTarget * 100));
    const cur = vq[vIdx];
    if (!cur) {
      const acc = vTotal ? Math.round(vRight / vTotal * 100) : 0;
      bodyHtml = `
        <div class="flash" style="margin-top:16px">
          <div class="w">今天的词汇做完了</div>
          <div class="m muted">今天一共过了 <b>${dayDone}</b> 个词${vTotal ? `，这一轮记得 ${vRight} 个（正确率 ${acc}%）` : ''}</div>
          <div class="progressline" style="max-width:420px;margin:14px auto 0"><i style="width:100%"></i></div>
          <p class="hint">今天的词汇目标已经打满（${dayDone} / ${dayTarget}）。明天它们会按 1 / 2 / 4 / 7 / 15 / 30 天的节奏自己排回来，你只需要今天如实点「记得」或「忘记」。</p>
          <div class="acts">
            <button class="btn" id="vRestart">再刷一轮</button>
            <button class="btn ghost" id="vUndo">↩ 退回上一个</button>
            <button class="btn ghost" data-vtab="bank">看看词库</button>
          </div>
        </div>`;
    } else {
      const word = S.words[cur.w] || cur;
      const hideWord = vMode === 'listen' && !vRevealed;
      const qPct = vq.length ? Math.round(vIdx / vq.length * 100) : 0;
      bodyHtml = `
        <div class="flash" style="margin-top:16px">
          <div style="position:absolute;right:14px;top:14px" title="今天已完成 ${dayDone} / ${dayTarget} 个词">${miniRing(dayPct, dayDone, dayTarget)}</div>
          <div class="w">${hideWord ? '<span class="muted" style="font-size:22px">🔊 听发音，想意思</span>' : esc(word.w)}</div>
          <div class="pos">${hideWord ? '' : esc(word.pos || '')}</div>
          <div class="m">${vRevealed || hideWord ? (vRevealed ? esc(word.m) : '<span class="muted">想出来了吗？点下面揭晓</span>') : '<span class="muted">先在心里想一遍，再点下面</span>'}</div>
          ${word.lapses ? `<div class="ex muted">这个词你忘了 ${word.lapses} 次${word.box !== null ? ` · 下次间隔 ${SRS_LABEL[word.box] || '1 天'}` : ''}</div>` : ''}
          ${vqSample.has(word.w) ? '<div class="ex muted">抽查：这个词还没到期，提前见一面</div>' : ''}
          <div class="acts">
            <button class="btn ghost" id="vUndo">↩ 上一个</button>
            <button class="btn ghost" id="vSpeak">🔊 听发音</button>
            ${vRevealed
              ? `<button class="btn ok" data-grade="1">记得</button><button class="btn danger" data-grade="0">忘记</button>`
              : `<button class="btn primary" id="vReveal">看答案</button>`}
          </div>
          <div class="progressline" style="max-width:420px;margin:18px auto 0">
            <i style="width:${dayPct}%"></i>
          </div>
          <p class="hint">今天已完成 <b>${dayDone}</b> / ${dayTarget} 个 · 这一轮还剩 ${Math.max(0, dayLeft)} 个 · 本轮认识 ${vRight}</p>
          <p class="hint">进度是<b>按今天累计</b>算的：中午背一半、下午接着背，不会归零；已经点过的词也不会再来一遍。</p>
        </div>`;
    }
  } else if (vocabTab === 'bank') {
    bodyHtml = `
      <div class="card" style="margin-top:16px">
        <h2>添加单词</h2>
        <div class="grid" style="grid-template-columns:1fr 90px 1.6fr auto">
          <input id="nwWord" type="text" placeholder="单词">
          <input id="nwPos" type="text" placeholder="词性">
          <input id="nwMean" type="text" placeholder="中文释义">
          <button class="btn primary" id="nwAdd">加入</button>
        </div>
        <label class="field"><span>批量导入（每行一个，支持 <span class="mono">word 释义</span> 或 <span class="mono">word|词性|释义</span>）</span>
          <textarea id="bulk" placeholder="influence 影响&#10;reliable|a.|可靠的"></textarea></label>
        <div class="row"><button class="btn" id="bulkAdd">导入这些词</button>
        <button class="btn ghost" id="seedAgain">补齐内置高频词表</button></div>
      </div>
      <div class="card">
        <h2>词库<span class="sub">${st.total} 个</span></h2>
        <input id="wSearch" type="text" placeholder="搜索单词或释义" value="${esc(window.__wq || '')}">
        <div class="mt" id="wList"></div>
      </div>`;
  } else {
    const pct = st.total ? Math.round(st.mastered / st.total * 100) : 0;
    bodyHtml = `
      <div class="card" style="margin-top:16px">
        <h2>词汇掌握情况</h2>
        <div class="grid three mt">
          <div><div class="muted tiny">未学</div><div style="font-size:26px;font-weight:650">${st.fresh}</div></div>
          <div><div class="muted tiny">学习中</div><div style="font-size:26px;font-weight:650">${st.learning}</div></div>
          <div><div class="muted tiny">已掌握（间隔≥15天）</div><div style="font-size:26px;font-weight:650">${st.mastered}</div></div>
        </div>
        <div class="progressline mt"><i style="width:${pct}%"></i></div>
        <p class="hint">已掌握 ${pct}%。这里的「掌握」不是你说了算，是间隔拉长到 15 天以上还没忘，才算。</p>
      </div>
      <div class="card">
        <h2>今天该复习的词</h2>
        <div class="mt" id="dueList"></div>
      </div>`;
  }

  el.innerHTML = tabsHtml + modeHtml + bodyHtml;

  el.querySelectorAll('[data-vtab]').forEach(b => b.onclick = () => {
    vocabTab = b.dataset.vtab;
    if (vocabTab === 'review') startNewQueue();
    renderVocab();
  });
  el.querySelectorAll('[data-vmode]').forEach(b => b.onclick = () => {
    vMode = b.dataset.vmode;
    vLastSpoken = -1;
    renderVocab();
  });
  const reveal = $('#vReveal'); if (reveal) reveal.onclick = () => { vRevealed = true; renderVocab(); };
  const spk = $('#vSpeak'); if (spk) spk.onclick = () => speak(vq[vIdx] ? vq[vIdx].w : '');
  const und = $('#vUndo'); if (und) und.onclick = undoLast;

  /* 听音想义模式：显示卡片就自动念一遍，不显示单词 */
  if (vocabTab === 'review' && vMode === 'listen' && !vRevealed && vq[vIdx] && vLastSpoken !== vIdx) {
    vLastSpoken = vIdx;
    speak(vq[vIdx].w);
  }
  el.querySelectorAll('[data-grade]').forEach(b => b.onclick = () => gradeWord(b.dataset.grade === '1'));
  const restart = $('#vRestart'); if (restart) restart.onclick = () => {
    /* 再刷一轮 = 额外加练：清掉今天的清单重新排一批，今天的累计进度照旧保留 */
    const d = ensureToday(); d.vqKeys = null;
    startNewQueue(); renderVocab();
  };
  const nwAdd = $('#nwAdd');
  if (nwAdd) {
    const doAdd = () => {
      const w = $('#nwWord').value.trim(), p = $('#nwPos').value.trim(), m = $('#nwMean').value.trim();
      if (!w || !m) return toast('单词和释义都要填', 'warn');
      addWord(w, p, m); toast('已加入词库', 'ok');
      vq = []; renderVocab();
    };
    nwAdd.onclick = doAdd;
    $('#nwWord').onkeydown = e => { if (e.key === 'Enter') doAdd(); };
  }
  const bulkAdd = $('#bulkAdd');
  if (bulkAdd) bulkAdd.onclick = () => {
    const lines = $('#bulk').value.split('\n').map(s => s.trim()).filter(Boolean);
    let n = 0;
    lines.forEach(line => {
      let w, pos = '', m;
      if (line.includes('|')) { const p = line.split('|').map(s => s.trim()); w = p[0]; pos = p[1] || ''; m = p[2] || ''; }
      else { const i = line.search(/[\s\u3000]+/); w = i > 0 ? line.slice(0, i) : line; m = i > 0 ? line.slice(i).trim() : ''; }
      if (w && m) { addWord(w, pos, m); n++; }
    });
    toast(`导入 ${n} 个词`, 'ok'); vq = []; renderVocab();
  };
  const seedAgain = $('#seedAgain');
  if (seedAgain) seedAgain.onclick = () => { const n = seedWords(); toast(n ? `补入 ${n} 个高频词` : '内置词表已经都在词库里了', 'ok'); renderVocab(); };
  const ws = $('#wSearch');
  if (ws) {
    ws.oninput = () => { window.__wq = ws.value; renderWordList(ws.value); };
    renderWordList(window.__wq || '');
  }
  const dl = $('#dueList');
  if (dl) {
    const due = Object.values(S.words).filter(w => w.box !== null && w.due && w.due <= todayKey()).slice(0, 200);
    dl.innerHTML = due.length ? `<table><thead><tr><th>单词</th><th>释义</th><th>记忆强度</th><th>上次安排</th></tr></thead><tbody>${
      due.map(w => `<tr><td class="mono">${esc(w.w)}</td><td>${esc(w.m)}</td><td>${w.box + 1}/6${w.lapses ? `（错 ${w.lapses} 次）` : ''}</td><td class="muted tiny">${esc(w.due)}</td></tr>`).join('')
    }</tbody></table>` : '<p class="muted">今天没有到期的词。</p>';
  }
}

function renderWordList(q) {
  const box = $('#wList'); if (!box) return;
  const kw = (q || '').toLowerCase();
  const list = Object.values(S.words)
    .filter(w => !kw || w.w.toLowerCase().includes(kw) || w.m.includes(kw))
    .sort((a, b) => (a.box === null ? -1 : a.box) - (b.box === null ? -1 : b.box) || a.w.localeCompare(b.w))
    .slice(0, 300);
  box.innerHTML = list.length ? `<table><thead><tr><th>单词</th><th>词性</th><th>释义</th><th>状态</th><th></th></tr></thead><tbody>${
    list.map(w => `<tr>
      <td class="mono">${esc(w.w)}</td><td class="muted">${esc(w.pos || '')}</td><td>${esc(w.m)}</td>
      <td class="muted tiny">${w.box === null ? '未学' : `强度 ${w.box + 1}/6`}</td>
      <td><button class="btn sm ghost" data-del-word="${esc(w.w)}">删</button></td></tr>`).join('')
  }</tbody></table><p class="hint">最多显示 300 条，用搜索框找具体的词。</p>` : '<p class="muted">没有匹配的词。</p>';
  box.querySelectorAll('[data-del-word]').forEach(b => b.onclick = () => {
    delete S.words[b.dataset.delWord]; save(true); renderWordList($('#wSearch') ? $('#wSearch').value : '');
  });
}

/* ---------------------------------------------------------------------
   6. 错题本
   --------------------------------------------------------------------- */
let mFilter = 'todo';

function mistakeForm(prefill) {
  const p = prefill || {};
  return `
    <h2>记一道错题</h2>
    <p class="hint">错因写具体一点：「定位错」比「粗心」有用一百倍。</p>
    <div class="grid two mt">
      <label class="field"><span>来源</span>
        <select id="mSource">${['听力', '阅读', '写作', '翻译', '词汇'].map(t => `<option ${p.source === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="field"><span>归类</span>
        <select id="mKind">${['定位错', '单词不认识', '连读没听清', '理解偏差', '语法错误', '时间不够', '其他'].map(t => `<option>${t}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>题目 / 场景（写一句能让你想起它的提示就行）</span>
      <textarea id="mQ" style="min-height:64px">${esc(p.q || '')}</textarea></label>
    <div class="grid two">
      <label class="field"><span>我的答案</span><input id="mMine" type="text" value="${esc(p.mine || '')}"></label>
      <label class="field"><span>正确答案 / 要点</span><input id="mRight" type="text" value="${esc(p.right || '')}"></label>
    </div>
    <label class="field"><span>错因（自己写）</span><textarea id="mWhy" style="min-height:64px"></textarea></label>
    <div class="row mt"><button class="btn primary" id="mSave">保存</button><button class="btn ghost" onclick="closeSheet()">取消</button></div>`;
}

function bindMistakeForm(prefill) {
  $('#mSave').onclick = () => {
    const item = {
      id: uid(),
      source: $('#mSource').value,
      kind: $('#mKind').value,
      q: $('#mQ').value.trim(),
      mine: $('#mMine').value.trim(),
      right: $('#mRight').value.trim(),
      why: $('#mWhy').value.trim(),
      createdAt: todayKey(),
      status: 'todo',
      reviewAt: shiftKey(todayKey(), 2)
    };
    if (!item.q && !item.mine) return toast('至少写一句题目提示', 'warn');
    S.mistakes.unshift(item); save(true); closeSheet();
    toast('已记下，2 天后会提醒你回炉', 'ok');
    render();
  };
}

function renderMistakes() {
  const el = $('#view-mistakes');
  const all = S.mistakes;
  const today = todayKey();
  const dueCount = all.filter(m => m.status === 'todo' && m.reviewAt <= today).length;
  const list = all.filter(m => mFilter === 'all' ? true : mFilter === 'todo' ? m.status === 'todo' : m.status === 'done');

  el.innerHTML = `
    <div class="card">
      <div class="row between">
        <div>
          <h2>错题本<span class="sub">${all.length} 条 · 待回炉 ${dueCount} 条</span></h2>
          <p class="hint">错题不是抄一遍就完事。写清错因，隔两天再自己重做一次，做对了才算过。</p>
        </div>
        <button class="btn primary" id="mAdd">+ 记一道错题</button>
      </div>
      <div class="row mt">
        ${[['todo', `待回炉 (${all.filter(m => m.status === 'todo').length})`], ['done', `已过关 (${all.filter(m => m.status === 'done').length})`], ['all', `全部 (${all.length})`]]
          .map(([id, label]) => `<button class="btn sm ${mFilter === id ? 'primary' : 'ghost'}" data-mfilter="${id}">${label}</button>`).join('')}
      </div>
    </div>
    <div class="card">
      ${list.length ? list.map(m => `
        <div class="task" data-done="${m.status === 'done'}" style="border-left-color:${m.status === 'done' ? 'var(--ok)' : 'var(--warn)'}">
          <div class="body">
            <div class="t-title">${esc(m.q || '(没写题目提示)')}</div>
            <div class="t-meta">
              <span class="chip">${esc(m.source)}</span>
              <span class="chip">${esc(m.kind)}</span>
              <span class="tiny muted">记录于 ${esc(m.createdAt)}${m.status === 'todo' ? ` · ${m.reviewAt <= today ? '今天该回炉' : esc(m.reviewAt) + ' 回炉'}` : ''}</span>
            </div>
            <div class="mt tiny"><span class="muted">我的答案：</span>${esc(m.mine || '—')} &nbsp; <span class="muted">正确：</span>${esc(m.right || '—')}</div>
            ${m.why ? `<div class="tiny" style="color:var(--warn)">错因：${esc(m.why)}</div>` : ''}
            <div class="row mt">
              ${m.status === 'todo'
                ? `<button class="btn sm ok" data-mpass="${m.id}">这次做对了</button>`
                : `<button class="btn sm ghost" data-mback="${m.id}">放回待回炉</button>`}
              <button class="btn sm ghost" data-mdel="${m.id}">删除</button>
            </div>
          </div>
        </div>`).join('') : '<p class="muted">这里还是空的。今天做错的题，随手记一条进来。</p>'}
    </div>`;

  $('#mAdd').onclick = () => { openSheet(mistakeForm()); bindMistakeForm(); };
  el.querySelectorAll('[data-mfilter]').forEach(b => b.onclick = () => { mFilter = b.dataset.mfilter; renderMistakes(); });
  el.querySelectorAll('[data-mpass]').forEach(b => b.onclick = () => {
    const m = S.mistakes.find(x => x.id === b.dataset.mpass);
    m.status = 'done'; save(true); renderMistakes(); toast('过关。这条不再烦你了', 'ok');
  });
  el.querySelectorAll('[data-mback]').forEach(b => b.onclick = () => {
    const m = S.mistakes.find(x => x.id === b.dataset.mback);
    m.status = 'todo'; m.reviewAt = shiftKey(todayKey(), 2); save(true); renderMistakes();
  });
  el.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => {
    S.mistakes = S.mistakes.filter(x => x.id !== b.dataset.mdel); save(true); renderMistakes();
  });
}

/* ---------------------------------------------------------------------
   7. 今日任务面板
   --------------------------------------------------------------------- */
function renderHeader() {
  const { left, phase } = dayInfo();
  $('#daysLeft').textContent = left;
  $('#streak').textContent = streakCount();
  $('#phaseLabel').textContent = `${phase.name} · ${phase.goal}`;
  const day = S.days[todayKey()] || {};
  const tasks = day.tasks || [];
  const done = tasks.filter(t => t.done).length;
  const pct = tasks.length ? Math.round(done / tasks.length * 100) : (day.checkin ? 100 : 0);
  const line = $('#dayLine');
  if (line) line.style.width = pct + '%';
  updateFab();
}

/* 手机上那个悬浮打卡按钮 */
function updateFab() {
  const fab = $('#fabCheckin');
  if (!fab) return;
  const day = S.days[todayKey()] || {};
  const tasks = day.tasks || [];
  if (day.checkin) { fab.dataset.hidden = 'true'; return; }
  const done = tasks.filter(t => t.done).length;
  fab.dataset.hidden = 'false';
  fab.textContent = done === 0 ? '✓ 今天打卡' : `✓ 打卡（${done}/${tasks.length}）`;
}

/* 打卡：统一入口，页面上那个按钮和悬浮按钮都走这里 */
function doCheckin() {
  const day = ensureToday();
  if (day.checkin) return;
  day.checkin = true; day.checkinAt = nowStamp(); save(true);
  const n = streakCount();
  celebrate(n > 1 ? `连续打卡 ${n} 天` : '今天打卡成功', n > 1 ? '保持住，别让它断' : '明天见');
  checkMilestone();
  render();
}

/* 一点小庆祝：三圈光晕散开 + 提示音 */
function celebrate(msg, sub) {
  const el = document.createElement('div');
  el.className = 'celebrate';
  el.innerHTML = `<div class="ringc"></div><div class="ringc d2"></div><div class="ringc d3"></div>
    <div class="msg">${esc(msg)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  document.body.appendChild(el);
  beep();
  setTimeout(() => el.remove(), 1300);
}

/* 词汇卡片右上角的小环形进度 */
function miniRing(pct, done, total) {
  const C = 2 * Math.PI * 24;
  return `<div class="miniring" title="已复习 ${done} / ${total}">
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle cx="29" cy="29" r="24" fill="none" stroke="color-mix(in srgb, var(--ink) 10%, transparent)" stroke-width="6"></circle>
      <circle cx="29" cy="29" r="24" fill="none" stroke="url(#mring)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"></circle>
      <defs><linearGradient id="mring" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--brand)"></stop>
        <stop offset="1" style="stop-color:var(--ok)"></stop>
      </linearGradient></defs>
    </svg>
    <b>${pct}%</b></div>`;
}

function ringHtml(pct) {
  const C = 2 * Math.PI * 42;
  return `<div class="ring">
    <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
      <circle cx="48" cy="48" r="42" fill="none" stroke="var(--panel2)" stroke-width="9"></circle>
      <circle cx="48" cy="48" r="42" fill="none" stroke="var(--brand)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"
        style="transition:stroke-dashoffset .4s ease"></circle>
    </svg>
    <div class="pct">${pct}%<small>今日完成</small></div>
  </div>`;
}

function renderToday() {
  const el = $('#view-today');
  const day = ensureToday();
  const done = day.tasks.filter(t => t.done).length;
  const total = day.tasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const { left, phase } = dayInfo();
  const st7 = recentStats(7);
  const rateNote = st7.rate === null ? '' : `近 7 天完成率 ${Math.round(st7.rate * 100)}%`;

  const tasksHtml = day.tasks.map((t, i) => `
    <div class="task" data-done="${t.done}" style="animation-delay:${Math.min(i * 40, 240)}ms">
      <button class="box" data-act="toggle" data-id="${t.id}" aria-label="标记完成">${t.done ? '✓' : ''}</button>
      <div class="body">
        <div class="t-title">${esc(t.title)}</div>
        <div class="t-meta">
          <span class="chip t-${esc(t.type)}">${esc(t.type)}</span>
          <span class="tiny muted">约 ${t.minutes} 分钟</span>
          ${t.spent ? `<span class="tiny muted">已专注 ${t.spent} 分钟</span>` : ''}
          ${t.custom ? '<span class="tiny muted">自定</span>' : ''}
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn sm" data-act="focus" data-id="${t.id}" data-min="${t.minutes}">开始专注</button>
          <button class="btn sm ghost" data-act="howto" data-id="${t.id}">怎么做</button>
          <button class="btn sm ghost" data-act="del" data-id="${t.id}">删掉</button>
        </div>
        <div class="howto" data-open="false" id="how-${t.id}">
          <ol>${(t.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
        </div>
      </div>
    </div>`).join('');

  const missed = (() => {
    let n = 0;
    for (let i = 3; i <= 10; i++) {
      const k = shiftKey(todayKey(), -i);
      if (S.days[k] && S.days[k].checkin) return 0;
      if (S.days[k]) n++;
    }
    return n;
  })();

  el.innerHTML = `
    <div class="card">
      <div class="today-head">
        ${ringHtml(pct)}
        <div style="flex:1;min-width:220px">
          <h2>今天是 ${todayKey()} · ${phase.name}<span class="sub">距考试 ${left} 天</span></h2>
          <p class="hint">${esc(day.note || '')}</p>
          <div class="row mt">
            <span class="stat-chip">任务 <b>${done}/${total}</b></span>
            <span class="stat-chip">今日专注 <b>${day.minutes || 0}</b> 分钟</span>
            <span class="stat-chip">番茄 <b>${day.pomodoros || 0}</b> 个</span>
            ${rateNote ? `<span class="stat-chip">${rateNote}</span>` : ''}
          </div>
        </div>
      </div>
      ${missed >= 2 ? `<div class="sep"></div><p class="hint" style="color:var(--warn)">已经 ${missed} 天没打卡了。回来的第一件事不是补上欠的，而是今天先做 15 分钟，把节奏接上。</p>` : ''}
    </div>

    ${(S.meta.scores || []).length === 0 ? `
    <div class="card" style="border-color:var(--warn)">
      <h2>第一步：先摸底<span class="sub">这件事今天就能做</span></h2>
      <p class="hint">你还没有任何模考记录，所以下面的任务量是按标准值给的，不一定配得上你的真实水平。找一套真题做一遍——听力听完、阅读做完就行，不用一次做完整卷。做完到「模考」页把听力、阅读的正确题数填进去，任务量就会跟着你的水平走。</p>
      <div class="row mt"><button class="btn primary" id="goDrill">去记一次摸底成绩</button></div>
    </div>` : ''}

    <div class="card">
      <div class="row between">
        <h2>今天的任务<span class="sub">按你最近的表现自动调整</span></h2>
        <div class="row">
          <button class="btn sm ghost" id="goRoutine">今天怎么走</button>
          <button class="btn sm ghost" id="regen">重新生成</button>
          <button class="btn sm" id="addTask">+ 自己加一条</button>
        </div>
      </div>
      <div class="mt">${tasksHtml || '<p class="muted">今天还没有任务，点「重新生成」。</p>'}</div>
    </div>

    <div class="card">
      <h2>材料进度<span class="sub">做完一个单元或一套，点一下 +1</span></h2>
      <div class="grid two mt">
        <div class="row between" style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2)">
          <div>《闪过四级词汇》<div style="font-size:20px;font-weight:650">第 ${S.settings.wordUnit || 1} / ${S.settings.wordUnitTotal || 11} 单元</div></div>
          <div class="row"><button class="btn sm" data-step="unit:-1">－</button><button class="btn sm primary" data-step="unit:1">+1 单元</button></div>
        </div>
        <div class="row between" style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2)">
          <div>《刘晓燕真题快刷》<div style="font-size:20px;font-weight:650">第 ${S.settings.zhentiNo || 1} 套</div></div>
          <div class="row"><button class="btn sm" data-step="zhenti:-1">－</button><button class="btn sm primary" data-step="zhenti:1">+1 套</button></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row between">
        <h2>打卡</h2>
        <span class="stat-chip">累计打卡 <b>${checkinDays()}</b> 天</span>
      </div>
      <p class="hint">打卡的意思是：今天至少真做过一件事。任务全做完是理想状态，做了一半也照打，不要因为没做完就干脆不打。</p>
      <label class="field"><span>今天的一句话（可留空：今天学到的一个点、卡住的地方、明天要先做什么）</span>
        <textarea id="dayNote">${esc(day.note2 || '')}</textarea></label>
      <div class="row mt">
        <button class="btn primary" id="checkin" ${day.checkin ? 'disabled' : ''}>${day.checkin ? '今天已打卡 ✓' : '今天打卡'}</button>
        <span class="muted tiny">漏打卡不会清空任何数据，日历上标红而已，随时可以接着来。</span>
      </div>
    </div>`;

  el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
    const id = btn.dataset.id;
    const task = day.tasks.find(t => t.id === id);
    if (!task) return;
    if (btn.dataset.act === 'toggle') {
      task.done = !task.done; task.doneAt = task.done ? nowStamp() : '';
      save(true); renderToday(); renderHeader();
      if (task.done && day.tasks.every(t => t.done)) celebrate('今天的任务全清完了', '比昨天多做了一点');
    } else if (btn.dataset.act === 'focus') {
      const mins = task.minutes >= 25 ? 25 : Math.max(5, task.minutes);
      pomoStart(mins, task.id, task.type + '专注');
      toast(`开始 ${mins} 分钟专注：${task.title.slice(0, 16)}…`, 'ok');
    } else if (btn.dataset.act === 'howto') {
      const box = $('#how-' + id);
      box.dataset.open = box.dataset.open === 'true' ? 'false' : 'true';
    } else if (btn.dataset.act === 'del') {
      day.tasks = day.tasks.filter(t => t.id !== id); save(true); renderToday();
    }
  });

  $('#regen').onclick = () => { ensureToday(true); renderToday(); toast('已按当前阶段重新排任务', 'ok'); };
  const goDrill = $('#goDrill');
  if (goDrill) goDrill.onclick = () => go('drill');
  const goRoutine = $('#goRoutine');
  if (goRoutine) goRoutine.onclick = () => go('routine');
  el.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const [key, delta] = b.dataset.step.split(':');
    const d = Number(delta);
    if (key === 'unit') S.settings.wordUnit = clamp((S.settings.wordUnit || 1) + d, 1, 200);
    else S.settings.zhentiNo = clamp((S.settings.zhentiNo || 1) + d, 1, 100);
    S.meta.lastOpen = todayKey();
    ensureToday(true);
    save(true);

const EXAM_MODULES = [
  ['全套模拟', 130, '和真实考试一样，一次做完，中间不休息不回看'],
  ['写作', 30, '30 分钟写完 120 词，写不完也要停笔'],
  ['听力', 25, '从播放开始到结束，不暂停'],

  ['翻译', 30, '汉译英一段，控制在 140-180 词']

function estimateScore(hear, read, wp) {
  const h = clamp(Number(hear) || 0, 0, 25) / 25 * 248.5;
  const r = clamp(Number(read) || 0, 0, 30) / 30 * 248.5;
  const w = clamp(Number(wp) || 0, 0, 100) / 100 * 213;
  return Math.round(h + r + w);
}

function renderDrill() {

  const scores = S.meta.scores || [];
  const last = scores[scores.length - 1];

  el.innerHTML = `

function buildWeeklyReport({ wk, prev, acc, newMistakes, series, done }) {
  const { left, phase } = dayInfo();
  const trend = prev === null || wk.rate === null ? '还没有上周数据可以比较' :
    wk.rate > prev + 0.05 ? '比上周稳' : wk.rate < prev - 0.05 ? '比上周松了' : '和上周差不多';
  const weak = (() => {
    const byKind = {};
    S.mistakes.filter(m => m.createdAt >= shiftKey(todayKey(), -13)).forEach(m => { byKind[m.kind] = (byKind[m.kind] || 0) + 1; });
    const top = Object.entries(byKind).sort((a, b) => b[1] - a[1])[0];
    return top ? `${top[0]}（${top[1]} 次）` : '数据还不够';
  })();
  const focus = wk.checkins < 5 ? '先把打卡次数提到 5 天，任务量不再加'
    : acc !== null && acc < 0.75 ? '把词汇正确率拉到 75% 以上，宁可少背新词'
    : series.length === 0 ? '周末完整做一套真题，拿到一个基准分'
    : '把最集中的那个错因，在错题本里清零一次';
  return [
    `【四级冲刺 · 第 ${Math.max(1, dayDiff(S.settings.startDate, todayKey()) + 1)} 天】${todayKey()}`,
    `阶段：${phase.name}　距考试 ${left} 天`,
    '',
    `本周打卡：${wk.checkins} / 7 天（累计 ${done} 天）`,
    `任务完成率：${wk.rate === null ? '—' : Math.round(wk.rate * 100) + '%'}，${trend}`,
    `总专注时长：${Math.round(wk.minutes / 6) / 10} 小时`,
    `词汇复习正确率：${acc === null ? '—' : Math.round(acc * 100) + '%'}`,
    `新增错题：${newMistakes} 条　最集中的错因：${weak}`,
    series.length ? `模考估分：${series.join(' → ')}` : '模考估分：本周没有记录，建议周末做一套',
    '',
    `下周只抓一件事：${focus}`,
    '',
    `（一句实话：${wk.checkins >= 5 ? '这周你确实做到了，保持住。' : '别重开计划，明天接着做 15 分钟就够。'}）`
  ].join('\n');
}

const PHASE_NAME = { foundation: '地基期', build: '强化期', sprint: '冲刺期' };
let routinePhase = null;

function materialize(list) {
  return list.map(s => ({ id: uid(), title: s.title, minutes: s.minutes, howto: s.howto || '' }));
}
function routineFor(phaseId) {
  S.routines = S.routines || {};
  if (!Array.isArray(S.routines[phaseId]) || S.routines[phaseId].length === 0) {
    S.routines[phaseId] = materialize(DEFAULT_ROUTINES[phaseId] || DEFAULT_ROUTINES.foundation);
    save();
  }
  return S.routines[phaseId];
}

function renderRoutine() {
  const el = $('#view-routine');
  const info = dayInfo();
  if (!routinePhase) routinePhase = info.phase.id;
  const list = routineFor(routinePhase);
  const day = ensureToday();
  day.stepDone = day.stepDone || {};
  const total = list.reduce((a, s) => a + (Number(s.minutes) || 0), 0);
  const doneCount = list.filter(s => day.stepDone[s.id]).length;
  const pct = list.length ? Math.round(doneCount / list.length * 100) : 0;
  const budget = S.settings.dailyMinutes || 110;

  const rows = list.map((s, i) => {
    const done = !!day.stepDone[s.id];
    return `<div class="task" data-done="${done}" style="animation-delay:${Math.min(i * 30, 240)}ms">
      <button class="box" data-rcheck="${s.id}" aria-label="标记完成">${done ? '✓' : ''}</button>

function openStepEditor(item, phaseId, onDone) {
  const isNew = !item;
  openSheet(`
    <h2>${isNew ? '加一步' : '改这一步'}</h2>
    <p class="hint">名称写成一看到就知道要做什么的动作，别写「学习」这种。</p>
    <label class="field"><span>这一步做什么</span><input id="stTitle" type="text" value="${esc(item ? item.title : '')}" placeholder="例如：把昨天点忘记的词单独过一遍"></label>
    <div class="grid two">
      <label class="field"><span>几分钟</span><input id="stMin" type="number" min="1" max="240" value="${item ? item.minutes : 15}"></label>
      <label class="field"><span>一句话说明（可留空）</span><input id="stHow" type="text" value="${esc(item ? item.howto : '')}"></label>
    </div>
    <div class="row mt"><button class="btn primary" id="stSave">保存</button><button class="btn ghost" onclick="closeSheet()">取消</button></div>`);
  $('#stSave').onclick = () => {
    const title = $('#stTitle').value.trim();
    if (!title) return toast('写一句这一步做什么', 'warn');
    const minutes = clamp(Number($('#stMin').value) || 15, 1, 240);
    const howto = $('#stHow').value.trim();
    const list = routineFor(phaseId);
    if (isNew) list.push({ id: uid(), title, minutes, howto });
    else {
      const t = list.find(x => x.id === item.id);
      if (t) { t.title = title; t.minutes = minutes; t.howto = howto; }
    }
    save(true); closeSheet();
    if (onDone) onDone(); else renderRoutine();
    toast('已保存', 'ok');
  };
}

function checkMilestone(silent) {
  const n = checkinDays();
  const hit = MILESTONES.filter(m => n >= m.n).map(m => m.n);
  const fresh = hit.filter(x => !S.meta.milestones.includes(x));
  if (fresh.length) {
    S.meta.milestones = [...new Set([...S.meta.milestones, ...hit])];
    save(true);
    if (!silent) {
      const m = MILESTONES.find(x => x.n === fresh[fresh.length - 1]);
      setTimeout(() => toast(`里程碑：${m.name} —— ${m.tip}`, 'ok'), 600);
    }
  }
}

function maybePromptReflection() {
  const k = todayKey();
  if (S.meta.lastPrompt === k) return;
  let missed = 0;
  for (let i = 1; i <= 3; i++) {
    const d = S.days[shiftKey(k, -i)];
    if (!d || !d.checkin) missed++;
  }
  if (missed < 3 || checkinDays() === 0) return;
  S.meta.lastPrompt = k; save(true);
  openSheet(`<h2>你连着 3 天没打卡了</h2>
    <p class="hint">我不会给你算逾期，也不会扣分——那样只会让你更不想打开它。只想请你写两句：这三天在忙什么？接下来打算把学习塞进哪个时间段？写下来的东西，比在心里发誓有用。</p>
    <textarea id="rfText" placeholder="例如：这周社团活动到很晚，晚上没精力；改成中午 12:40 在自习室先做 25 分钟听力。"></textarea>
    <div class="row mt"><button class="btn primary" id="rfSave">写完了，继续</button><button class="btn ghost" id="rfSkip">先跳过</button></div>`);
  $('#rfSave').onclick = () => {
    const text = $('#rfText').value.trim();
    if (text.length < 5) return toast('多写几个字吧', 'warn');
    S.reflections.push({ date: k, text }); save(true); closeSheet();
    toast('记下了。今天就做 15 分钟，把节奏接上', 'ok');
    render();
  };
  $('#rfSkip').onclick = () => closeSheet();
}
