  today: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="3.2" width="11.6" height="10.6" rx="2.2"></rect><path d="M2.2 6.6h11.6M5.6 1.9v2.6M10.4 1.9v2.6"></path></svg>',
  routine: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.2 4h7.4M6.2 8h7.4M6.2 12h7.4M2.4 4h.01M2.4 8h.01M2.4 12h.01" stroke-width="1.8"></path></svg>',
  vocab: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.4 3.2H4.6A1.6 1.6 0 0 0 3 4.8v8.6a1.6 1.6 0 0 1 1.6-1.6h2.8V3.2Z"></path><path d="M8.6 3.2h2.8A1.6 1.6 0 0 1 13 4.8v8.6a1.6 1.6 0 0 0-1.6-1.6H8.6V3.2Z"></path></svg>',
  drill: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9.2" r="5"></circle><path d="M8 9.2V6.4M6.4 1.9h3.2"></path></svg>',
  mistakes: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.8v12.4M4 2.9h8.2l-1.7 2.6 1.7 2.6H4"></path></svg>',
  review: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 13.4h11.2M4.6 13.4V7.6M8 13.4V3.6M11.4 13.4v-3.4"></path></svg>',
  settings: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 5.2h10.8M2.6 10.8h10.8"></path><circle cx="6" cy="5.2" r="1.7"></circle><circle cx="10" cy="10.8" r="1.7"></circle></svg>'
};
const TABS = [['today', '今日'], ['routine', '流程'], ['vocab', '词汇'], ['drill', '模考'], ['mistakes', '错题'], ['review', '复盘'], ['settings', '设置']];
let currentTab = 'today';

function renderTabs() {
  const due = S.mistakes.filter(m => m.status === 'todo' && m.reviewAt <= todayKey()).length;
  $('#tabs').innerHTML = TABS.map(([id, label]) =>
    `<button class="tab" data-tab="${id}" aria-current="${currentTab === id}">${ICONS[id] || ''}<span>${label}</span>${id === 'mistakes' && due ? `<span class="badge">${due}</span>` : ''}</button>`).join('');
  $$('#tabs .tab').forEach(b => b.onclick = () => go(b.dataset.tab));
}

function go(tab) {
  currentTab = tab;
  try { location.hash = tab; } catch (e) { /* file:// 下没问题，忽略异常 */ }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  renderHeader();
  renderTabs();
  $$('section.view').forEach(v => { v.dataset.active = String(v.id === 'view-' + currentTab); });
  if (currentTab === 'today') renderToday();
  else if (currentTab === 'routine') renderRoutine();
  else if (currentTab === 'vocab') renderVocab();
  else if (currentTab === 'drill') renderDrill();
  else if (currentTab === 'mistakes') renderMistakes();
  else if (currentTab === 'review') renderReview();
  else if (currentTab === 'settings') renderSettings();
}

function boot() {
  applyTheme();
  showSplash();
  if (Object.keys(S.words).length === 0) seedWords();
  migrateWordOrder();
  dailyBackup();
  ensureToday();
  const h = (location.hash || '').replace('#', '');
  if (TABS.some(([id]) => id === h)) currentTab = h;
  render();
  restorePomo();
  checkMilestone(true);
  setTimeout(maybePromptReflection, 900);
}

/* 打开 App 时的一秒封面 */
/* 检查「离线可用」：有没有被 Service Worker 完整缓存到这台设备上 */
async function offlineStatus() {
  try {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') {
      return '本地文件方式打开，本来就不需要联网';
    }
    if (!('serviceWorker' in navigator)) {
      return '当前地址不支持离线缓存 —— 局域网 IP 不行，必须是 https 网址';
    }
    /* 缓存是后台进行的，所以多等几次再下结论 */
    for (let i = 0; i < 10; i++) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        const keys = await caches.keys();
        let n = 0;
        for (const k of keys) { const c = await caches.open(k); n += (await c.keys()).length; }
        if (n > 0) return `已缓存 ${n} 个文件 —— 断网、关电脑、出门都能打开`;
      }
      await new Promise(r => setTimeout(r, 400));
    }
    return '还没缓存完，让页面多停留十几秒再回来看看';
  } catch (e) {
    return '检查失败，可能是浏览器不允许';
  }
}

function showSplash() {
  const sp = $('#splash');
  if (!sp) return;
  const cover = $('#splashCover');
  if (cover && COVER_DATA && COVER_DATA.indexOf('data:image') === 0) {
    cover.style.backgroundImage = `url("${COVER_DATA}")`;
  } else if (cover) {
    cover.style.background = 'linear-gradient(160deg,var(--brand),var(--bg))';
  }
  const d = $('#splashDays');
  if (d) d.textContent = dayInfo().left;
  setTimeout(() => { sp.dataset.off = 'true'; }, 950);
  setTimeout(() => { if (sp.parentNode) sp.remove(); }, 1600);
}

boot();

/* 部署到 https 或 http 上时注册离线缓存，这样装到手机主屏后断网也能用。
   用 file:// 直接双击打开时这段会跳过，不影响使用。 */
if (location.protocol === 'https:' || location.protocol === 'http:') {
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { /* 老浏览器忽略 */ }
}
